name: Send Firebase Cloud Messaging Notification

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Notification title'
        required: true
        type: string
      body:
        description: 'Notification body'
        required: true
        type: string
      topic:
        description: 'FCM topic'
        required: true
        type: string
  repository_dispatch:
    types: [send-notification]

jobs:
  send-notification:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'notifications-backend/package-lock.json'

      - name: Install dependencies
        run: |
          cd notifications-backend
          # لو مفيش فايل اسمه package.json ومسبب مشكلة في الكاش، الـ install العادي هيتصرف
          npm install firebase-admin --no-audit --no-fund

      - name: Create service account file
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cd notifications-backend
          echo "$FIREBASE_SERVICE_ACCOUNT" > serviceAccountKey.json
          echo "✅ Service account file created"

      - name: Send FCM notification
        env:
          NOTIF_TITLE: ${{ github.event.inputs.title || github.event.client_payload.title }}
          NOTIF_BODY: ${{ github.event.inputs.body || github.event.client_payload.body }}
          NOTIF_TOPIC: ${{ github.event.inputs.topic || github.event.client_payload.topic }}
        run: |
          cd notifications-backend
          node -e "
          const admin = require('firebase-admin');
          const serviceAccount = require('./serviceAccountKey.json');
          
          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount),
          });
          
          (async () => {
            try {
              console.log('📤 Sending FCM notification...');
              console.log('   Title:', process.env.NOTIF_TITLE);
              console.log('   Body:', process.env.NOTIF_BODY);
              console.log('   Topic:', process.env.NOTIF_TOPIC);
              
              const message = {
                notification: {
                  title: process.env.NOTIF_TITLE,
                  body: process.env.NOTIF_BODY,
                },
                android: {
                  priority: 'high',
                  notification: {
                    channelId: 'high_importance_channel', // عدلناها هنا عشان تطابق الأندرويد
                    priority: 'max',
                    sound: 'default',
                  },
                },
                apns: {
                  payload: {
                    aps: {
                      sound: 'default',
                    },
                  },
                },
                topic: process.env.NOTIF_TOPIC,
              };
              
              const response = await admin.messaging().send(message);
              console.log('✅ Notification sent successfully!');
              console.log('   Message ID:', response);
              
            } catch (error) {
              console.error('❌ Failed to send notification:');
              console.error('   Error:', error.message);
              process.exit(1);
            } finally {
              process.exit(0);
            }
          })();
          "

      - name: Cleanup
        if: always()
        run: |
          cd notifications-backend
          rm -f serviceAccountKey.json
          echo "🧹 Cleaned up service account file"

      - name: Notification result
        if: success()
        run: |
          echo "🎉 FCM notification workflow completed successfully!"
          echo "   Topic: ${{ github.event.inputs.topic || github.event.client_payload.topic }}"