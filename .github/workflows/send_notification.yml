name: Send Firebase Cloud Messaging Notification

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Notification title'
        required: true
        type: string
      body:
        description: 'Notification body'
        required: true
        type: string
      topic:
        description: 'FCM topic'
        required: false
        type: string
      token:
        description: 'FCM token'
        required: false
        type: string

jobs:
  send-notification:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install firebase-admin
        run: npm install firebase-admin

      - name: Create service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > serviceAccountKey.json

      - name: Send notification
        env:
          NOTIF_TITLE: ${{ github.event.inputs.title }}
          NOTIF_BODY: ${{ github.event.inputs.body }}
          NOTIF_TOPIC: ${{ github.event.inputs.topic }}
          NOTIF_TOKEN: ${{ github.event.inputs.token }}
        run: |
          node -e "
          const admin = require('firebase-admin');
          const serviceAccount = require('./serviceAccountKey.json');

          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount)
          });

          async function send() {
            try {
              const token = String(process.env.NOTIF_TOKEN || '').trim();
              const topic = String(process.env.NOTIF_TOPIC || '').trim();
              const useToken = token.length > 0;

              const message = {
                notification: {
                  title: process.env.NOTIF_TITLE,
                  body: process.env.NOTIF_BODY
                },
                data: {
                  click_action: 'FLUTTER_NOTIFICATION_CLICK',
                  source: 'github_actions'
                },
                android: {
                  priority: 'high'
                }
              };

              if (useToken) {
                message.token = token;
                console.log('TARGET_MODE: token');
                console.log('TARGET_TOKEN:', token);
              } else {
                message.topic = topic;
                console.log('TARGET_MODE: topic');
                console.log('TARGET_TOPIC:', topic);
              }

              console.log('SENDING_MESSAGE:', JSON.stringify(message, null, 2));

              const response = await admin.messaging().send(message);
              console.log('SUCCESS: Firebase response =', response);
            } catch (e) {
              console.error('ERROR_NAME:', e?.name || 'UnknownError');
              console.error('ERROR_MESSAGE:', e?.message || String(e));
              console.error('ERROR_STACK:', e?.stack || 'No stack');
              console.error('ERROR_FULL:', e);
              process.exit(1);
            }
          }

          send();
          "

      - name: Cleanup
        if: always()
        run: rm -f serviceAccountKey.json
